<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Usage Meter</title>
<style>
  :root {
    --bg:        #0d0d12;
    --surface:   #16161e;
    --surface2:  #1e1e2a;
    --border:    #2a2a3a;
    --text:      #e8e8f0;
    --muted:     #666688;
    --opus-a:    #a855f7;
    --opus-b:    #f59e0b;
    --sonnet-a:  #3b82f6;
    --sonnet-b:  #06b6d4;
    --haiku-a:   #10b981;
    --haiku-b:   #84cc16;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 80px;
  }

  /* ── header ── */
  .logo {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, #a855f7, #3b82f6);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; margin-bottom: 18px;
  }
  h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.02em; }
  .tagline { font-size: 0.82rem; color: var(--muted); margin-top: 4px; margin-bottom: 44px; }

  /* ── API key input ── */
  .key-section {
    width: 100%; max-width: 520px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 36px;
  }
  .key-label {
    font-size: 0.75rem; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 12px;
    display: block;
  }
  .key-row {
    display: flex; gap: 10px; align-items: center;
  }
  .key-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 0.85rem;
    font-family: "SF Mono", "Fira Code", monospace;
    outline: none;
    transition: border-color 0.2s;
  }
  .key-input:focus { border-color: #a855f7; }
  .key-input::placeholder { color: var(--muted); }
  .btn-check {
    padding: 10px 20px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, #a855f7, #3b82f6);
    color: #fff;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.2s;
  }
  .btn-check:hover { opacity: 0.85; }
  .btn-check:disabled { opacity: 0.4; cursor: not-allowed; }
  .key-hint {
    font-size: 0.72rem; color: var(--muted);
    margin-top: 10px; line-height: 1.6;
  }
  .key-hint a { color: #a855f7; text-decoration: none; }
  .key-hint a:hover { text-decoration: underline; }

  /* save toggle */
  .save-row {
    display: flex; align-items: center; gap: 8px;
    margin-top: 14px;
  }
  .toggle {
    position: relative; width: 36px; height: 20px;
    cursor: pointer;
  }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0;
    background: var(--border);
    border-radius: 99px;
    transition: background 0.2s;
  }
  .slider::before {
    content: '';
    position: absolute;
    width: 14px; height: 14px;
    left: 3px; top: 3px;
    background: #fff;
    border-radius: 50%;
    transition: transform 0.2s;
  }
  input:checked + .slider { background: #a855f7; }
  input:checked + .slider::before { transform: translateX(16px); }
  .save-label { font-size: 0.75rem; color: var(--muted); }

  /* ── status / error ── */
  #status {
    font-size: 0.8rem; margin-bottom: 12px;
    min-height: 20px; color: var(--muted);
  }
  #status.error { color: #ef4444; }
  #status.ok    { color: #10b981; }

  /* ── cards ── */
  .cards {
    display: flex; gap: 24px; flex-wrap: wrap;
    justify-content: center;
    width: 100%; max-width: 980px;
    margin-bottom: 48px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 24px 24px;
    flex: 1 1 260px; max-width: 295px;
    display: flex; flex-direction: column;
    align-items: center; gap: 18px;
    position: relative; overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: -70px; left: 50%; transform: translateX(-50%);
    width: 220px; height: 220px;
    border-radius: 50%; opacity: 0.06; pointer-events: none;
  }
  .card.opus::before   { background: radial-gradient(circle, #a855f7, #f59e0b); }
  .card.sonnet::before { background: radial-gradient(circle, #3b82f6, #06b6d4); }
  .card.haiku::before  { background: radial-gradient(circle, #10b981, #84cc16); }
  .card.loading { opacity: 0.4; }

  .model-label {
    font-size: 0.72rem; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
  }

  /* gauge */
  .gauge-wrap { position: relative; width: 172px; height: 172px; }
  .gauge-wrap svg { transform: rotate(-90deg); display: block; }
  .gauge-bg   { fill: none; stroke: var(--border); stroke-width: 10; }
  .gauge-fill { fill: none; stroke-width: 10; stroke-linecap: round;
                transition: stroke-dashoffset 1s cubic-bezier(0.4,0,0.2,1); }
  .gauge-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px;
  }
  .gauge-pct  { font-size: 1.9rem; font-weight: 700; line-height: 1; }
  .gauge-sub  { font-size: 0.68rem; color: var(--muted); text-align: center; }

  .stats { width: 100%; display: flex; flex-direction: column; gap: 9px; }
  .stat-row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.76rem;
  }
  .stat-label { color: var(--muted); }
  .stat-val   { font-variant-numeric: tabular-nums; font-weight: 500; }
  .divider    { width: 100%; height: 1px; background: var(--border); }
  .reset-note {
    font-size: 0.66rem; color: var(--muted);
    text-align: center; line-height: 1.5;
  }

  .ok     { color: #10b981 !important; }
  .warn   { color: #f59e0b !important; }
  .danger { color: #ef4444 !important; }

  /* ── footer ── */
  .footer {
    font-size: 0.72rem; color: var(--muted);
    text-align: center; line-height: 2;
  }
  .footer a { color: #a855f7; text-decoration: none; }
  .btn-refresh {
    margin-top: 14px;
    padding: 6px 22px;
    border-radius: 99px;
    border: 1px solid var(--border);
    background: transparent; color: var(--muted);
    font-size: 0.78rem; cursor: pointer; transition: all 0.2s;
  }
  .btn-refresh:hover { color: var(--text); border-color: #555; }
  #updated-at { font-size: 0.72rem; color: var(--muted); margin-bottom: 10px; }

  code {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px; font-size: 0.85em;
    font-family: "SF Mono", "Fira Code", monospace;
  }
</style>
</head>
<body>

<div class="logo">⚡</div>
<h1>Claude Usage Meter</h1>
<p class="tagline">Opus · Sonnet · Haiku の残りトークンをリアルタイム確認</p>

<!-- API key input -->
<div class="key-section">
  <span class="key-label">Anthropic API Key</span>
  <div class="key-row">
    <input type="password" id="api-key" class="key-input"
           placeholder="sk-ant-api03-…" autocomplete="off" spellcheck="false">
    <button class="btn-check" id="btn-check" onclick="checkAll()">確認</button>
  </div>
  <p class="key-hint">
    APIキーは <a href="https://console.anthropic.com/settings/keys" target="_blank">console.anthropic.com</a> で取得できます。<br>
    キーはこのブラウザ内でのみ使用され、サーバーには保存されません。
  </p>
  <div class="save-row">
    <label class="toggle">
      <input type="checkbox" id="save-key" onchange="onSaveToggle()">
      <span class="slider"></span>
    </label>
    <span class="save-label">このブラウザにキーを保存する</span>
  </div>
</div>

<p id="status"></p>
<p id="updated-at"></p>

<div class="cards" id="cards"></div>

<div class="footer">
  APIキーはブラウザ（localStorage）にのみ保存されます。<br>
  ソースコード: <a href="https://github.com/3Daddy-AI/Claude-meter" target="_blank">github.com/3Daddy-AI/Claude-meter</a>
  <br>
  <button class="btn-refresh" id="btn-refresh" onclick="checkAll()" style="display:none">↻ 再確認</button>
</div>

<script>
// ── 設定 ──────────────────────────────────────────────────────────────
// Vercelデプロイ後は自動的に /api/probe を使用。ローカルテスト用に変更可。
const PROBE_URL = "/api/probe";

const MODELS = [
  { key: "opus",   id: "claude-opus-4-6",             label: "Opus",   from: "#a855f7", to: "#f59e0b", gid: "gO" },
  { key: "sonnet", id: "claude-sonnet-4-6",            label: "Sonnet", from: "#3b82f6", to: "#06b6d4", gid: "gS" },
  { key: "haiku",  id: "claude-haiku-4-5-20251001",    label: "Haiku",  from: "#10b981", to: "#84cc16", gid: "gH" },
];
// ─────────────────────────────────────────────────────────────────────

function fmtN(n) {
  n = Number(n);
  if (isNaN(n)) return "—";
  if (n >= 1e6) return (n/1e6).toFixed(1) + "M";
  if (n >= 1e3) return (n/1e3).toFixed(1) + "K";
  return String(n);
}

function colorCls(pct) {
  if (pct >= 0.9) return "danger";
  if (pct >= 0.7) return "warn";
  return "ok";
}

function fmtReset(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d)) return null;
  const diff = Math.max(0, Math.round((d - Date.now()) / 1000));
  if (diff < 60) return `${diff}秒後にリセット`;
  if (diff < 3600) return `${Math.floor(diff/60)}分後にリセット`;
  return `${Math.floor(diff/3600)}時間後にリセット`;
}

function buildSVG(pct, m) {
  const R=76, CX=86, CY=86, C=2*Math.PI*R;
  const f = C * Math.min(Math.max(pct,0), 1);
  return `<svg width="172" height="172" viewBox="0 0 172 172">
    <defs>
      <linearGradient id="${m.gid}" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"   stop-color="${m.from}"/>
        <stop offset="100%" stop-color="${m.to}"/>
      </linearGradient>
    </defs>
    <circle class="gauge-bg"   cx="${CX}" cy="${CY}" r="${R}"/>
    <circle class="gauge-fill" cx="${CX}" cy="${CY}" r="${R}"
      stroke="url(#${m.gid})"
      stroke-dasharray="${f} ${C-f}"
      stroke-dashoffset="0"/>
  </svg>`;
}

function buildCard(m, data) {
  const rl = data?.rateLimits ?? {};
  const tok = rl.tokens ?? {};
  const limit     = Number(tok.limit)     || 0;
  const remaining = Number(tok.remaining) || 0;
  const used      = Math.max(limit - remaining, 0);
  const pct       = limit > 0 ? used / limit : 0;
  const resetTxt  = fmtReset(tok.reset);

  const card = document.createElement("div");
  card.className = `card ${m.key}`;
  card.id = `card-${m.key}`;

  // gauge
  const gw = document.createElement("div");
  gw.className = "gauge-wrap";
  gw.innerHTML = buildSVG(pct, m);
  const gc = document.createElement("div");
  gc.className = "gauge-center";
  if (limit > 0) {
    gc.innerHTML = `
      <span class="gauge-pct ${colorCls(pct)}">${Math.round(pct*100)}%</span>
      <span class="gauge-sub">残り ${fmtN(remaining)}</span>`;
  } else {
    gc.innerHTML = `<span class="gauge-pct" style="font-size:1.1rem;color:var(--muted)">—</span>`;
  }
  gw.appendChild(gc);

  card.innerHTML = `<div class="model-label">${m.label}</div>`;
  card.appendChild(gw);
  card.insertAdjacentHTML("beforeend", `
    <div class="stats">
      <div class="stat-row">
        <span class="stat-label">上限（/分）</span>
        <span class="stat-val">${fmtN(tok.limit)}</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">使用済み</span>
        <span class="stat-val">${fmtN(used)}</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">残り</span>
        <span class="stat-val ${colorCls(pct)}">${fmtN(remaining)}</span>
      </div>
      <div class="divider"></div>
      <div class="stat-row">
        <span class="stat-label">リクエスト残り</span>
        <span class="stat-val">${fmtN(rl.requests?.remaining)} / ${fmtN(rl.requests?.limit)}</span>
      </div>
      ${resetTxt ? `<div class="reset-note">↺ ${resetTxt}</div>` : ""}
    </div>`);
  return card;
}

function buildSkeletonCard(m) {
  const card = document.createElement("div");
  card.className = `card ${m.key} loading`;
  card.id = `card-${m.key}`;
  const gw = document.createElement("div");
  gw.className = "gauge-wrap";
  gw.innerHTML = buildSVG(0, m);
  const gc = document.createElement("div");
  gc.className = "gauge-center";
  gc.innerHTML = `<span class="gauge-pct" style="font-size:1rem;color:var(--muted)">…</span>`;
  gw.appendChild(gc);
  card.innerHTML = `<div class="model-label">${m.label}</div>`;
  card.appendChild(gw);
  return card;
}

async function probeModel(apiKey, model) {
  const res = await fetch(PROBE_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ apiKey, model: model.id }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error ?? `HTTP ${res.status}`);
  }
  return res.json();
}

async function checkAll() {
  const apiKey = document.getElementById("api-key").value.trim();
  if (!apiKey) {
    setStatus("APIキーを入力してください", "error");
    return;
  }
  if (!apiKey.startsWith("sk-ant-")) {
    setStatus("有効なAnthropicのAPIキー（sk-ant-…）を入力してください", "error");
    return;
  }

  // skeleton cards
  const container = document.getElementById("cards");
  container.innerHTML = "";
  MODELS.forEach(m => container.appendChild(buildSkeletonCard(m)));

  document.getElementById("btn-check").disabled  = true;
  document.getElementById("btn-refresh").style.display = "none";
  setStatus("確認中…");

  const results = await Promise.allSettled(
    MODELS.map(m => probeModel(apiKey, m))
  );

  container.innerHTML = "";
  let anyOk = false;
  results.forEach((r, i) => {
    const m = MODELS[i];
    if (r.status === "fulfilled") {
      container.appendChild(buildCard(m, r.value));
      anyOk = true;
    } else {
      const card = buildCard(m, null);
      card.classList.remove("loading");
      // show error badge
      card.querySelector(".gauge-center").innerHTML =
        `<span style="font-size:0.72rem;color:#ef4444;text-align:center;padding:0 8px">${r.reason?.message ?? "エラー"}</span>`;
      container.appendChild(card);
    }
  });

  document.getElementById("btn-check").disabled = false;
  document.getElementById("btn-refresh").style.display = "inline-block";

  if (anyOk) {
    setStatus("✓ 取得完了", "ok");
    document.getElementById("updated-at").textContent =
      `最終更新: ${new Date().toLocaleString("ja-JP")}`;
  } else {
    setStatus("APIキーが無効か、アクセスできませんでした", "error");
  }
}

function setStatus(msg, cls = "") {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = cls;
}

function onSaveToggle() {
  const save = document.getElementById("save-key").checked;
  const key  = document.getElementById("api-key").value.trim();
  if (save && key) {
    localStorage.setItem("claude_meter_key", key);
  } else {
    localStorage.removeItem("claude_meter_key");
  }
}

// persist on input change if toggle is on
document.getElementById("api-key").addEventListener("input", () => {
  if (document.getElementById("save-key").checked) {
    onSaveToggle();
  }
});

// restore saved key on load
window.addEventListener("DOMContentLoaded", () => {
  const saved = localStorage.getItem("claude_meter_key");
  if (saved) {
    document.getElementById("api-key").value = saved;
    document.getElementById("save-key").checked = true;
  }
});
</script>
</body>
</html>
